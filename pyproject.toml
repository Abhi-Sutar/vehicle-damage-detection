[project]
name = "vehicle-damage-detection"
version = "0.1.0"
description = "Vehicle damage instance segmentation with YOLOv8n-seg, OpenCV and FastAPI."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.0",
    "opencv-python-headless>=4.10,<5",
    "python-multipart>=0.0.18",
    "pyyaml>=6.0",
    "ultralytics>=8.4,<9",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8", "ruff>=0.15"]
cpu = ["torch>=2.14,<2.15", "torchvision>=0.29,<0.30"]
cu130 = ["torch>=2.14,<2.15", "torchvision>=0.29,<0.30"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vehicle_damage"]

[tool.uv]
required-version = ">=0.13"
default-groups = ["dev", "cu130"]
conflicts = [[{ group = "cpu" }, { group = "cu130" }]]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu130", group = "cu130" },
]
torchvision = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu130", group = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

